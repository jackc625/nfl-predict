















<div class="week-selector flex flex-wrap items-center gap-2">
  
  <div class="flex items-center gap-2 mr-2">
    <label for="season-select" class="label">Season</label>
    <select id="season-select" name="season"
            hx-get="/fragments/games"
            hx-target="#game-grid"
            hx-swap="innerHTML"
            hx-include="[name='sort']"
            hx-vals='{"week": ""}'
            class="skew-control">
      
      <option value="2024" selected>2024</option>
      
      <option value="2023" >2023</option>
      
    </select>
  </div>
  
  <label for="week-select" class="label">Week</label>
  <div class="flex items-center gap-1">
    
    
    
    
      
    
      
        
          
          
          
        
        
          
          
          
        
      
    
      
    

    
    <button hx-get="/fragments/games?week=3&season=2024&sort=confidence" hx-target="#game-grid" hx-swap="innerHTML"
            class="skew-control"
            aria-label="Previous Week">
      <span class="unskew"><svg class="w-4 h-4 text-accent" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></span>
    </button>

    
    <select id="week-select" name="week"
            hx-get="/fragments/games"
            hx-target="#game-grid"
            hx-swap="innerHTML"
            hx-include="[name='sort'],[name='season']"
            class="skew-control">
      
      <option value="3" data-season="2024" >
        Week 3
      </option>
      
      <option value="2" data-season="2024" selected>
        Week 2
      </option>
      
      <option value="1" data-season="2024" >
        Week 1
      </option>
      
    </select>

    
    <button hx-get="/fragments/games?week=1&season=2024&sort=confidence" hx-target="#game-grid" hx-swap="innerHTML"
            class="skew-control"
            aria-label="Next Week">
      <span class="unskew"><svg class="w-4 h-4 text-accent" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span>
    </button>
  </div>
</div>
