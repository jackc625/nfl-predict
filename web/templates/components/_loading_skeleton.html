{# Loading skeleton component. Pass variant: "cards", "table", or "chart" #}
{% if variant == "cards" %}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
  {% for _ in range(6) %}
  <div class="bg-white rounded-lg border border-gray-200 p-4 md:p-6 animate-pulse">
    <div class="h-4 bg-gray-200 rounded w-3/4 mb-3"></div>
    <div class="h-3 bg-gray-200 rounded w-1/2 mb-4"></div>
    <div class="grid grid-cols-3 gap-3">
      <div class="h-8 bg-gray-200 rounded"></div>
      <div class="h-8 bg-gray-200 rounded"></div>
      <div class="h-8 bg-gray-200 rounded"></div>
    </div>
  </div>
  {% endfor %}
</div>
{% elif variant == "chart" %}
<div class="bg-white rounded-lg border border-gray-200 p-6 animate-pulse">
  <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
  <div class="h-64 bg-gray-100 rounded"></div>
</div>
{% elif variant == "table" %}
<div class="bg-white rounded-lg border border-gray-200 p-6 animate-pulse">
  <div class="h-4 bg-gray-200 rounded w-1/4 mb-4"></div>
  {% for _ in range(5) %}
  <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
  {% endfor %}
</div>
{% endif %}
