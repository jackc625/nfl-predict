{# Confidence badge pill. Pass: level ("high"/"medium"/"low"), value (display text) #}
{% if level == "high" %}
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800 border border-green-200">{{ value }}</span>
{% elif level == "medium" %}
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">{{ value }}</span>
{% else %}
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-600 border border-red-200">{{ value }}</span>
{% endif %}
