# The emergency-schedule-move evidence table (Plan 33.2-10 Task 2, SPEC R8, D33.2-04, D33.2-21).
#
# ONE ROW PER MOVE, not per game: a game moved twice has two rows, ordered by move_index.
# Every game in config/schedule_move_candidates.toml has at least one row, and no row names
# a game outside it (tests/unit/test_schedule_move_table.py asserts both directions).
#
# D33.2-21 BOUNDS THE EVIDENCE: one dated contemporaneous source per move, no second source,
# no exhaustive hunt. A publication time is an UPPER BOUND on the announcement time, which
# is the direction the proof needs: if the report existed by then, so did the announcement.
#
# FIELDS
#   what_moved   closed vocabulary: venue | date | week | scheduled_not_moved
#   from_value / to_value, by what_moved:
#     venue                the data/venues.json stadium_id
#     date                 the kickoff's calendar date in America/New_York, YYYY-MM-DD
#     week                 "W<nn> YYYY-MM-DD": week number and ET kickoff date
#     scheduled_not_moved  "<stadium_id> YYYY-MM-DD", the scheduled facts; from == to
#   announced_at_utc     the upper bound, in UTC, taken from the source:
#     - a source with a time: that time, converted to UTC;
#     - a source with only a date: 23:59:59 that day in America/Los_Angeles, the latest
#       instant the date can denote for a US publisher.
#     A revision ("Updated") time or a Wayback Machine capture time is also a valid upper
#     bound: the text reporting the move existed then. Each row's notes say which it is.
#   source_published_at  the timestamp exactly as the source states it (or its date)
#   lock_utc             utils.game_lock.game_lock of the game's kickoff: 18:00
#                        America/New_York on the ET day before kickoff, in UTC
#   verdict              pre_lock  -- needs a non-empty source_url AND
#                                     announced_at_utc <= lock_utc (AT the lock is known)
#                        post_lock -- the default; needs no source. The game is rebuilt with
#                                     the facts as they stood before the move.
#
# A game's facts at its lock come from the LAST move, in move_index order, whose verdict is
# pre_lock; with none, the facts before its first move. features/schedule_moves.py is the
# one place that selection is made.
#
# SCHEDULED GAMES (Super Bowls, the Bills Toronto Series, the Wednesday and Christmas games
# of the published schedule) are candidates the scans surface but were never moved. Each has
# one scheduled_not_moved row with from_value == to_value. Their verdict follows the ordinary
# rule; no announcement source was sought, so they carry the post_lock default, which
# changes nothing because the facts before and after are the same.
#
# THE LIMITATION: this repository holds no ORIGINAL schedule. A game moved to another WEEK
# (Hurricane Ike 2008, Hurricane Irma 2017, the October 2020 COVID week swaps) is invisible
# to every mechanical scan; those games are rows here only because the enumerator's
# committed inputs name them. Without a citation they would take the post_lock default.
#
# Research surfaced five games no criterion named (the committed entry path,
# RESEARCH_DISCOVERED_GAME_IDS): 2004_W01_TEN@MIA, 2005_W07_KC@MIA, 2018_W06_SEA@LV,
# 2018_W11_KC@LA and 2023_W19_PIT@BUF. It also extended three named events: Katrina (the
# four Baton Rouge games), Ike (the displaced Bengals game) and COVID (eleven more 2020
# reschedules).
#
# Researched 2026-09-21. ASCII only, no emoji (CLAUDE.md hard constraint).

