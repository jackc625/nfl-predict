# The seven 2025 games played outside the United States, which the nflverse schedule feed
# records at the US home team's own stadium (Plan 33.2-09, SPEC R8 venue half).
#
# READ BY TWO CONSUMERS THROUGH ONE FUNCTION (scripts.ingest_games.resolve_venue_override):
#   * scripts/ingest_games.py applies it to every ingested row, so the next ingest of 2025
#     cannot restore the wrong venue;
#   * scripts/repair_international_venues.py applied it ONCE to silver `games`.
#
# Measured 2026-09-21: the pinned 2025 schedule AND the live nflverse games.csv
# (github.com/nflverse/nfldata, data/games.csv) both still carry the home team's id for
# all seven, so the override is live, not a no-op.
#
# Every entry carries a source. `old_stadium_id` is the value the feed sends; any OTHER
# feed value raises VenueOverrideDriftError rather than being overridden unexamined.
# `venue_name`, `city` and `country` must equal the data/venues.json record of
# `new_stadium_id` (the loader refuses a disagreement).
#
# `source_url` is the league or broadcaster announcement naming the venue; `source_date`
# is its publication date. For the three London games the announcement names each
# designated home team's stadium (Browns and Jets at Tottenham Hotspur Stadium, Jaguars at
# Wembley); each of those teams hosted exactly one neutral-site game in 2025, which is the
# row named here. `corroboration_url` is the results table of a PINNED Wikipedia revision
# (oldid 1375744239, 2026-09-19), which lists venue, date and score for all seven.

