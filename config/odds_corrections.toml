[[family]]
name = "odds_snapshot_created_at_legacy_integer_seconds"
cause = "The first historical odds ingest (scripts/ingest_historical_odds.py as added in 7c70abf, line 71) wrote \"created_at\": game.get(\"season\") -- the season integer -- and a later append read that integer column through data/storage.py::_migrate_schema_for_append's pd.to_datetime(..., unit=\"s\"), so season 2018 became 2,018 seconds after the epoch (1970-01-01 00:33:38) and 2024 became 00:33:44."
detector = "MECHANISM: created_at is non-null, has no sub-second part, and its epoch-seconds value either equals the season in the row's own game_id or decodes before 2000-01-01 UTC (a real capture instant from datetime.now carries microseconds and post-dates the project). SYMPTOM: created_at parses to calendar year 1970. A row is a member when either holds; both counts are reported separately."
disposition = "nulled"
disposition_counts = "repaired 0, nulled 1855"
column = "created_at"
reason = "The true write time of these rows is not recoverable. The stored value is the season, not a time, and no other source records when each row was written: the owned odds_timeline's timestamps are the instants its own snapshots were taken and ingested (2020-2024 and 2026-08-16), not the instant an odds_snapshot row was created. So each value is set to NULL -- an honest unknown -- and the row is kept for grading and CLV (D33.2-23). created_at is lineage only; no feature, grade or model reads it."
