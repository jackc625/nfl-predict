# The 2002-2005 Monday and Thursday NIGHT games whose feed clock is a 12-hour AM/PM error
# (Plan 33.2-12, p332_ extra step 3c, orchestrator-assigned; deferred-items entry found by
# Plan 33.2-10).
#
# THE DEFECT. The nflverse schedule (github.com/nflverse/nfldata data/games.csv, and the
# pinned feed the ingest reads) carries `gametime = "09:00"` for all 68 of these games, and
# NFL.com's own game pages carry the same 09:00 (checked 2026-09-21 on
# nfl.com/games/eagles-at-redskins-2002-reg-2), so the error is upstream of nflverse. The
# ET DATE is right, so no lock moves; the clock is 12 hours early.
#
# READ BY TWO CONSUMERS THROUGH ONE FUNCTION (scripts.ingest_games.resolve_kickoff_gametime):
#   * scripts/ingest_games.py applies it to every ingested row, so a re-ingest of 2002-2005
#     cannot restore the wrong hour;
#   * scripts/repair_kickoff_hours.py applied it ONCE to silver `games`.
# A feed that later sends any clock other than `feed_gametime` or `corrected_gametime`, or a
# different `gameday`, raises KickoffCorrectionDriftError rather than being overridden blind.
#
# THE CORRECTION. `corrected_gametime` is the SCHEDULED start, 21:00 ET, the same convention
# as every other silver kickoff (scheduled, never the actual first snap). Every entry cites a
# per-game source for the ACTUAL start, and the loader refuses an entry whose cited start is
# not in [corrected_gametime, corrected_gametime + 30 min):
#   * `source_url` is an Internet Archive capture of the game's Pro-Football-Reference box
#     score, whose scorebox prints "Start Time" in Eastern time (verified against the
#     official gamebooks below: e.g. 2002_W05_GB@CHI, PFR "9:08pm", gamebook "8:08 PM CDT").
#     The live site refuses automated requests; the capture is the same page, frozen.
#     `source_start_time` restates that start in ET.
#   * `gamebook_url` / `gamebook_start_time`, where present, are an Internet Archive capture
#     of the official NFL Gamebook (nflcdns.nfl.com, retired) and its "Start Time" verbatim,
#     in the stadium's own zone. Where both sources exist they agree to the minute.
#   * 2002_W01_PIT@NE's only PFR capture predates the Start Time field, so its source is the
#     gamebook itself.
#
# THE STANDING GUARD. tests/unit/test_kickoff_hour_sanity.py refuses any 2002-2025 silver
# kickoff before noon ET unless it satisfies [international_morning_exception]: the NFL's
# games abroad kick off at 9:30 AM ET so they air in the European afternoon.

[international_morning_exception]
rule = "a Sunday game at a venue whose data/venues.json country is not USA, kicking off at 09:30 ET"
weekday = "Sunday"
kickoff_et = "09:30"
source_url = "https://en.wikipedia.org/w/index.php?title=NFL_International_Series&oldid=1375744239"
source_note = "the International Series results table lists every game abroad; the London games air at 9:30 AM ET (2:30 PM UK)"

