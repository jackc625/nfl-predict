# THE PROVENANCE OF THIS RE-MEASUREMENT, so the verdict above can be reproduced and,
# when the time comes, superseded honestly. A verdict with no gold digest is a verdict
# nobody can reproduce; one with no objective invites being read as a CLV lift.
[remeasurement]
plan = "33.2-22"
decision = "D33.2-15"
generator = "python -m scripts.remeasure_group_verdict --apply"
objective = "outcome_loss"
objective_anchor = "paired out-of-sample outcome-loss improvement (baseline_loss - candidate_loss): WP per-game log loss clipped to WP_LOG_LOSS_CLIP; ATS and O/U per-game absolute error. No market line of any timing enters it."
measured_seasons = [2023, 2024]
selection_seasons = [2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021]
hp_val_seasons = [2022]
holdout_seasons = [2023, 2024]
excluded_hold_seasons = [2025]
# The OpenMP thread count this measurement was pinned to. It is recorded because the
# screen's XGBoost legs return different answers at different thread counts -- by
# enough to move a verdict -- so a run that did not pin this could not be reproduced.
thread_limit = 1
gold_generation_digest = "484397642530db5b28c49d9234ecfb90e3860783f1b1b41766ab6151a1522597"
